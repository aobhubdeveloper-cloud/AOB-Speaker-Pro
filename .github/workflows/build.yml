name: Build
on: [push,pull_request]
jobs:
 core:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
   - run: cmake --build build/core --parallel
   - run: ctest --test-dir build/core --output-on-failure
 windows:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: lukka/get-cmake@latest
   - name: Configure
     shell: pwsh
     run: cmake -S . -B build/windows -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
   - run: cmake --build build/windows --config Release --parallel
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - uses: android-actions/setup-android@v3
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.10"
   - run: gradle -p apps/android assembleDebug --no-daemon
