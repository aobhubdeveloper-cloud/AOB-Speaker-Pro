name: Build
on: [push,pull_request]
jobs:
 core:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
   - run: cmake --build build/core --parallel
   - run: ctest --test-dir build/core --output-on-failure
 windows:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: lukka/get-cmake@latest
   - name: Configure
     shell: pwsh
     run: cmake -S . -B build/windows -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
   - run: cmake --build build/windows --config Release --parallel
   - name: Package Windows
     shell: pwsh
     run: Compress-Archive -Path build/windows/apps/windows/Release/* -DestinationPath aob-speaker-pro-windows.zip
   - uses: actions/upload-artifact@v4
     with:
      name: aob-speaker-pro-windows
      path: aob-speaker-pro-windows.zip
 android:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: "17"
   - name: Install Android SDK packages
     env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
     run: |
      SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
      yes | "$SDKMANAGER" --licenses >/dev/null || true
      "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: "8.10"
   - run: gradle -p apps/android assembleDebug --no-daemon
   - uses: actions/upload-artifact@v4
     with:
      name: aob-speaker-pro-android
      path: apps/android/app/build/outputs/apk/debug/*.apk