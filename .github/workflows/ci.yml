name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core documentation
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/architecture.md
          test -f docs/protocol.md
          test -f docs/audio-quality.md
          test -f docs/development.md
          test -f third_party/THIRD_PARTY_NOTICES.md

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest

      - name: Configure x64
        shell: pwsh
        run: cmake -S . -B build/windows-x64 -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build x64
        run: cmake --build build/windows-x64 --config Release --parallel

      - name: Configure x86
        shell: pwsh
        run: cmake -S . -B build/windows-x86 -A Win32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x86-windows-static

      - name: Build x86
        run: cmake --build build/windows-x86 --config Release --parallel

      - name: Prepare direct Windows executables
        shell: pwsh
        run: |
          $x64Exe = Get-ChildItem build/windows-x64 -Recurse -Filter aob-speaker-pro.exe -File | Select-Object -First 1
          $x86Exe = Get-ChildItem build/windows-x86 -Recurse -Filter aob-speaker-pro.exe -File | Select-Object -First 1
          if (-not $x64Exe) { throw "Windows x64 executable was not produced." }
          if (-not $x86Exe) { throw "Windows x86 executable was not produced." }
          Copy-Item $x64Exe.FullName "AOB-Speaker-Pro-Windows-x64-v0.1.0.exe" -Force
          Copy-Item $x86Exe.FullName "AOB-Speaker-Pro-Windows-x86-v0.1.0.exe" -Force
          Get-Item "AOB-Speaker-Pro-Windows-x64-v0.1.0.exe"
          Get-Item "AOB-Speaker-Pro-Windows-x86-v0.1.0.exe"

      - name: Publish direct Windows executables
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload v0.1.0 "AOB-Speaker-Pro-Windows-x64-v0.1.0.exe" "AOB-Speaker-Pro-Windows-x86-v0.1.0.exe" --clobber

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release marker
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if grep -q '\[release\]' <<< "$COMMIT_MESSAGE"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Assemble Android APK
        run: gradle -p apps/android assembleDebug --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
          gh release upload v0.1.0 "apps/android/app/build/outputs/apk/debug/app-debug.apk#AOB-Speaker-Pro-v0.1.0.apk" --clobber
