name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate core documentation
        shell: bash
        run: |
          test -f README.md
          test -f LICENSE
          test -f docs/architecture.md
          test -f docs/protocol.md
          test -f docs/audio-quality.md
          test -f docs/development.md
          test -f third_party/THIRD_PARTY_NOTICES.md

  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check release marker
        id: release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if ($env:COMMIT_MESSAGE -match '\\[release\\]') { "should_release=true" >> $env:GITHUB_OUTPUT } else { "should_release=false" >> $env:GITHUB_OUTPUT }
      - name: Configure x64
        if: steps.release.outputs.should_release == 'true'
        run: cmake -S . -B build/windows-x64 -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build x64
        if: steps.release.outputs.should_release == 'true'
        run: cmake --build build/windows-x64 --config Release --parallel
      - name: Configure x86
        if: steps.release.outputs.should_release == 'true'
        run: cmake -S . -B build/windows-x86 -A Win32 -DCMAKE_BUILD_TYPE=Release
      - name: Build x86
        if: steps.release.outputs.should_release == 'true'
        run: cmake --build build/windows-x86 --config Release --parallel
      - name: Package Windows releases
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows-x64/Release/* -DestinationPath AOB-Speaker-Pro-Windows-x64-v0.1.0.zip -Force
          Compress-Archive -Path build/windows-x86/Release/* -DestinationPath AOB-Speaker-Pro-Windows-x86-v0.1.0.zip -Force
      - name: Publish Windows assets
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload v0.1.0 AOB-Speaker-Pro-Windows-x64-v0.1.0.zip --clobber
          gh release upload v0.1.0 AOB-Speaker-Pro-Windows-x86-v0.1.0.zip --clobber

  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release marker
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if grep -q '\[release\]' <<< "$COMMIT_MESSAGE"; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android APK
        if: steps.release.outputs.should_release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        if: steps.release.outputs.should_release == 'true'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Setup Gradle
        if: steps.release.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Assemble Android APK
        if: steps.release.outputs.should_release == 'true'
        run: gradle -p apps/android assembleDebug --no-daemon

      - name: Publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
          gh release create v0.1.0 \
            apps/android/app/build/outputs/apk/debug/app-debug.apk#AOB-Speaker-Pro-v0.1.0.apk \
            --title "AOB Speaker Pro v0.1.0" \
            --notes "First Android release of AOB Speaker Pro."
