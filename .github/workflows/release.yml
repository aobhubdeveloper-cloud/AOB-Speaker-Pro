name: Release Android

on:
  push:
    branches:
      - release/v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build release APK
        run: gradle -p apps/android assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f apps/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            apps/android/app/build/outputs/apk/debug/app-debug.apk#AOB-Speaker-Pro-v0.1.0.apk \
            --title "AOB Speaker Pro v0.1.0" \
            --notes "First Android release of AOB Speaker Pro.

Android:
- Version: 0.1.0
- Minimum Android: 8.0 (API 26)
- Target Android: 15 (API 35)

This release is built from the verified Android CI build."
