name: CI Watchdog

on:
  workflow_run:
    workflows: ["CI", "Build"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry-failed:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait before recheck
        run: sleep 20
      - name: Recheck and retry failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "Rechecking workflow run $RUN_ID after 20 seconds..."
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY"
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
